<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Hong Kong Map</title>

  <link
    rel="stylesheet"
    href="https://unpkg.com/maplibre-gl@^6.15.0/dist/maplibre-gl.css"
  >
  <style>
    html, body, #map {
      width: 100%;
      height: 100%;
      margin: 0;
    }

    .map-label {
      position: absolute;
      top: 12px;
      left: 12px;
      z-index: 1;
      padding: 8px 12px;
      border-radius: 4px;
      background: white;
      font: 14px/1.4 sans-serif;
      box-shadow: 0 1px 4px #0003;
    }
  </style>
</head>
<body>
  <div class="map-label">Hong Kong</div>
  <div id="map"></div>

  <script type="module">
    import * as maplibregl from
      "https://unpkg.com/maplibre-gl@^6.15.0/dist/maplibre-gl.mjs";

    const map = new maplibregl.Map({
      container: "map",
      style: "https://demotiles.maplibre.org/style.json",
      center: [74.5, 40],
      zoom: 10
    });

    map.addControl(new maplibregl.NavigationControl(), "top-right");
    map.addControl(new maplibregl.ScaleControl(), "bottom-left");

    new maplibregl.Marker({ color: "#d62828" })
      .setLngLat([114.1694, 22.3193])
      .setPopup(new maplibregl.Popup().setText("Hong Kong"))
      .addTo(map);
  </script>
</body>
</html>
